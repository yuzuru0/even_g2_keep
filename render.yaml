services:
  - type: web
    name: even-g2-keep
    env: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GOOGLE_EMAIL
        sync: false
      - key: GOOGLE_MASTER_TOKEN
        sync: false
      - key: APP_SECRET
        sync: false
      - key: PORT
        value: 10000
